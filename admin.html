<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Re:GLOW FITNESS トレーニング記録 管理画面</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; background: #f2f2f2; color: #111; }
  .header { background: #1a1a1a; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
  .header-title { color: #fff; font-size: 16px; font-weight: 700; }
  .header-logout { color: #999; font-size: 12px; cursor: pointer; }
  .container { max-width: 900px; margin: 0 auto; padding: 16px; }
  .screen { display: none; }
  .screen.active { display: block; }

  /* ログイン画面 */
  .login-wrap { max-width: 340px; margin: 80px auto; background: white; border-radius: 14px; padding: 28px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .login-title { font-size: 16px; font-weight: 700; margin-bottom: 20px; text-align: center; }
  .login-input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; margin-bottom: 12px; }
  .login-btn { width: 100%; padding: 12px; background: #FF5A36; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .login-error { color: #e74c3c; font-size: 12px; margin-top: 8px; text-align: center; }

  /* タブ */
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab-btn { padding: 10px 18px; border-radius: 10px; border: 1px solid #ddd; background: white; font-size: 13px; font-weight: 700; color: #555; cursor: pointer; }
  .tab-btn.active { background: #1a1a1a; color: white; border-color: #1a1a1a; }

  /* 会員別記録 */
  .search-box { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; margin-bottom: 12px; background: white; }
  .alpha-index-bar { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
  .alpha-index-chip { font-size: 11px; font-weight: 700; color: #555; background: white; border: 1px solid #ddd; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
  .alpha-index-chip:hover { background: #f0f0f0; }
  .alpha-section-badge { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 8px; background: #1a1a1a; color: white; font-size: 13px; font-weight: 700; margin-right: 8px; flex-shrink: 0; }
  .alpha-section-title { display: flex; align-items: center; margin: 18px 0 8px; }
  .alpha-section-title:first-child { margin-top: 0; }
  .customer-row { background: white; border-radius: 10px; padding: 12px 16px; margin-bottom: 6px; border: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .customer-row:hover { background: #fafafa; }
  .customer-main { flex: 1; cursor: pointer; }
  .customer-name { font-size: 14px; font-weight: 700; }
  .customer-meta { font-size: 11px; color: #999; margin-top: 2px; }
  .furigana-input { font-size: 11px; color: #666; border: 1px solid transparent; background: transparent; padding: 2px 4px; border-radius: 4px; width: 110px; }
  .furigana-input:hover, .furigana-input:focus { border-color: #ddd; background: #fafafa; outline: none; }
  .furigana-input.empty { color: #ccc; }
  .blocked-badge { font-size: 10px; background: #ffe0e0; color: #c0392b; padding: 2px 8px; border-radius: 99px; font-weight: 700; flex-shrink: 0; }

  .back-link { color: #FF5A36; font-size: 13px; font-weight: 700; cursor: pointer; margin-bottom: 12px; display: inline-block; }
  .customer-detail-header { background: white; border-radius: 12px; padding: 16px; margin-bottom: 14px; border: 1px solid #eee; }
  .customer-detail-name { font-size: 17px; font-weight: 700; }

  .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .stat-card { background: white; border-radius: 12px; padding: 16px; border: 1px solid #eee; }
  .stat-card-label { font-size: 11px; color: #999; font-weight: 700; margin-bottom: 8px; }
  .stat-card-value { font-size: 26px; font-weight: 700; color: #FF5A36; }
  .stat-card-sub { font-size: 11px; color: #aaa; margin-top: 4px; }
  .trainer-bar-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; }
  .trainer-bar-name { width: 64px; flex-shrink: 0; color: #555; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trainer-bar-track { flex: 1; background: #f0f0f0; border-radius: 99px; height: 8px; overflow: hidden; }
  .trainer-bar-fill { height: 100%; background: #FF5A36; border-radius: 99px; }
  .trainer-bar-count { width: 46px; flex-shrink: 0; text-align: right; color: #999; font-size: 11px; }

  .log-card { background: white; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; border: 1px solid #eee; cursor: pointer; }
  .log-card:hover { background: #fafafa; }
  .log-card-top { display: flex; justify-content: space-between; align-items: baseline; }
  .log-date { font-size: 13px; font-weight: 700; color: #FF5A36; }
  .log-trainer { font-size: 11px; color: #999; }
  .log-exercises { font-size: 13px; color: #444; margin-top: 6px; }
  .log-satisfaction { font-size: 12px; color: #d99a00; margin-top: 4px; }

  .detail-modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; }
  .detail-modal-bg.active { display: flex; align-items: center; justify-content: center; padding: 16px; }
  .detail-modal { background: white; border-radius: 14px; padding: 20px; max-width: 420px; width: 100%; max-height: 85vh; overflow-y: auto; }
  .detail-modal-close { text-align: right; color: #999; font-size: 13px; cursor: pointer; margin-bottom: 8px; }
  .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid #f0f0f0; font-size: 13px; }
  .detail-row:first-of-type { border-top: none; }
  .ex-block { background: #f7f7f7; border-radius: 10px; padding: 12px 14px; margin-top: 10px; }
  .ex-block-name { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .ex-block-sets { font-size: 13px; color: #444; line-height: 1.8; }
  .memo-block { background: #fff8e1; border-radius: 10px; padding: 12px 14px; margin-top: 10px; font-size: 13px; color: #6a5000; line-height: 1.6; }

  .empty-msg { text-align: center; color: #999; font-size: 13px; padding: 30px 0; }
  .loading { text-align: center; color: #999; font-size: 13px; padding: 30px 0; }
  .section-label { font-size: 12px; color: #888; font-weight: 700; margin: 18px 0 8px; }

  /* 種目マスター管理 */
  .add-exercise-form { background: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #eee; display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-group label { font-size: 11px; color: #888; font-weight: 700; }
  .form-group input, .form-group select { padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; }
  .add-btn { padding: 9px 18px; background: #FF5A36; color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }

  .bodypart-section-title { font-size: 13px; font-weight: 700; color: #888; margin: 16px 0 8px; }
  .exercise-row { background: white; border-radius: 10px; padding: 10px 14px; margin-bottom: 6px; border: 1px solid #eee; display: flex; align-items: center; gap: 10px; }
  .exercise-row-name { flex: 1; font-size: 13px; font-weight: 600; }
  .exercise-row-name input { width: 100%; border: none; background: transparent; font-size: 13px; font-weight: 600; }
  .exercise-row-name input:focus { outline: 1px solid #FF5A36; border-radius: 4px; padding: 2px 4px; }
  .exercise-row-btn { font-size: 11px; padding: 5px 10px; border-radius: 6px; border: 1px solid #ddd; background: white; cursor: pointer; color: #666; }
  .exercise-row-btn.danger { color: #e74c3c; border-color: #f5c6c6; }
</style>
</head>
<body>

<div class="screen active" id="screen-login">
  <div class="login-wrap">
    <div class="login-title">トレーニング記録 管理画面</div>
    <input class="login-input" type="email" id="login-email" placeholder="メールアドレス">
    <input class="login-input" type="password" id="login-password" placeholder="パスワード">
    <button class="login-btn" onclick="doLogin()">ログイン</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div class="screen" id="screen-main">
  <div class="header">
    <div class="header-title">Re:GLOW FITNESS トレーニング記録</div>
    <div class="header-logout" onclick="doLogout()">ログアウト</div>
  </div>
  <div class="container">
    <div class="tabs">
      <div class="tab-btn active" id="tab-customers" onclick="switchTab('customers')">会員別記録</div>
      <div class="tab-btn" id="tab-exercises" onclick="switchTab('exercises')">種目マスター管理</div>
    </div>

    <!-- 会員別記録タブ -->
    <div id="panel-customers">
      <div id="customer-list-view">
        <input class="search-box" id="customer-search" placeholder="会員名で検索" oninput="renderCustomerList()">
        <div class="alpha-index-bar" id="alpha-index-bar"></div>
        <div id="customer-list"><div class="loading">読み込み中...</div></div>
      </div>
      <div id="customer-detail-view" style="display:none;">
        <span class="back-link" onclick="backToCustomerList()">‹ 会員一覧に戻る</span>
        <div class="customer-detail-header">
          <div class="customer-detail-name" id="detail-customer-name"></div>
        </div>
        <div class="stats-row" id="customer-stats-row"></div>
        <div class="section-label">記録一覧</div>
        <div id="customer-logs-list"><div class="loading">読み込み中...</div></div>
      </div>
    </div>

    <!-- 種目マスター管理タブ -->
    <div id="panel-exercises" style="display:none;">
      <div class="add-exercise-form">
        <div class="form-group">
          <label>種目名</label>
          <input type="text" id="new-ex-name" placeholder="例: バーベルカール">
        </div>
        <div class="form-group">
          <label>部位</label>
          <select id="new-ex-bodypart">
            <option value="胸">胸</option>
            <option value="背中">背中</option>
            <option value="肩">肩</option>
            <option value="脚">脚</option>
            <option value="腕">腕</option>
            <option value="腹">腹</option>
            <option value="その他">その他</option>
          </select>
        </div>
        <button class="add-btn" onclick="addExercise()">＋ 追加</button>
      </div>
      <div id="exercise-master-list"><div class="loading">読み込み中...</div></div>
    </div>
  </div>
</div>

<!-- 記録詳細モーダル -->
<div class="detail-modal-bg" id="detail-modal-bg" onclick="if(event.target===this)closeDetailModal()">
  <div class="detail-modal" id="detail-modal-content"></div>
</div>

<script>
const SUPABASE_URL = 'https://plapbyvgthymszrzbsgl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-FVZ_yzggmRe8cTv4oGXJg_4zqIZEIc';

// 部位の固定表示順（この配列にない部位は末尾に五十音順で追加される）
const BODYPART_ORDER = ['胸', '背中', '肩', '脚', '腕', '腹', 'その他'];

let sbClient = null;
let allCustomers = [];
let currentCustomer = null;
let currentCustomerLogs = [];
let exerciseMaster = [];

// 五十音の固定並び順（この配列順で表示・グループ化する。#（判定不可）は必ず最後）
const GOJUON_CHARS = ['あ','い','う','え','お','か','き','く','け','こ','さ','し','す','せ','そ','た','ち','つ','て','と','な','に','ぬ','ね','の','は','ひ','ふ','へ','ほ','ま','み','む','め','も','や','ゆ','よ','ら','り','る','れ','ろ','わ','を','ん'];

// 濁点・半濁点・小文字・拗音などを清音の五十音に丸め込むための対応表
const GOJUON_NORMALIZE = {
  'が':'か','ぎ':'き','ぐ':'く','げ':'け','ご':'こ',
  'ざ':'さ','じ':'し','ず':'す','ぜ':'せ','ぞ':'そ',
  'だ':'た','ぢ':'ち','づ':'つ','で':'て','ど':'と','っ':'つ',
  'ば':'は','び':'ひ','ぶ':'ふ','べ':'へ','ぼ':'ほ',
  'ぱ':'は','ぴ':'ひ','ぷ':'ふ','ぺ':'へ','ぽ':'ほ',
  'ぁ':'あ','ぃ':'い','ぅ':'う','ぇ':'え','ぉ':'お',
  'ゃ':'や','ゅ':'ゆ','ょ':'よ','ゎ':'わ'
};

// カタカナ → ひらがな変換
function toHiraganaChar(ch){
  const code = ch.charCodeAt(0);
  if (code >= 0x30A1 && code <= 0x30F6) {
    return String.fromCharCode(code - 0x60);
  }
  return ch;
}

function getGojuonLabel(customer){
  // ふりがなが登録されていればそれを優先。なければ名前から推定（漢字等は判定できず#になる）
  const source = (customer.furigana && customer.furigana.trim()) ? customer.furigana.trim() : (customer.name || '').trim();
  if (!source) return '#';
  let first = toHiraganaChar(source[0]);
  if (GOJUON_NORMALIZE[first]) first = GOJUON_NORMALIZE[first];
  if (GOJUON_CHARS.includes(first)) return first;
  return '#';
}

async function init(){
  sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data: { session } } = await sbClient.auth.getSession();
  if (session) {
    showMainScreen();
  }
}

async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if (!email || !password) { errEl.textContent = 'メールアドレスとパスワードを入力してください'; return; }
  const { error } = await sbClient.auth.signInWithPassword({ email, password });
  if (error) { errEl.textContent = 'ログインに失敗しました。メールアドレスとパスワードをご確認ください。'; return; }
  showMainScreen();
}

async function doLogout(){
  await sbClient.auth.signOut();
  document.getElementById('screen-main').classList.remove('active');
  document.getElementById('screen-login').classList.add('active');
}

async function showMainScreen(){
  document.getElementById('screen-login').classList.remove('active');
  document.getElementById('screen-main').classList.add('active');
  await loadCustomers();
  await loadExerciseMaster();
}

function switchTab(tab){
  document.getElementById('tab-customers').classList.toggle('active', tab === 'customers');
  document.getElementById('tab-exercises').classList.toggle('active', tab === 'exercises');
  document.getElementById('panel-customers').style.display = tab === 'customers' ? 'block' : 'none';
  document.getElementById('panel-exercises').style.display = tab === 'exercises' ? 'block' : 'none';
}

// ===== 会員別記録 =====
async function loadCustomers(){
  const { data } = await sbClient.from('customers').select('id,name,is_blocked,furigana').order('name');
  allCustomers = data || [];
  renderCustomerList();
}

function renderCustomerList(){
  const kw = document.getElementById('customer-search').value.trim();
  const listEl = document.getElementById('customer-list');
  const barEl = document.getElementById('alpha-index-bar');
  const filtered = kw ? allCustomers.filter(c => (c.name||'').includes(kw) || (c.furigana||'').includes(kw)) : allCustomers;
  if (!filtered.length) {
    listEl.innerHTML = '<div class="empty-msg">該当する会員がいません</div>';
    barEl.innerHTML = '';
    return;
  }

  // ラベルごとにグループ化
  const groups = {};
  for (const c of filtered) {
    const label = getGojuonLabel(c);
    if (!groups[label]) groups[label] = [];
    groups[label].push(c);
  }
  // 各グループ内は五十音（ふりがな優先）→ふりがなが同じ場合は名前で安定ソート
  for (const label in groups) {
    groups[label].sort((a, b) => {
      const fa = (a.furigana || a.name || '');
      const fb = (b.furigana || b.name || '');
      return fa.localeCompare(fb, 'ja');
    });
  }

  // 固定の五十音順でグループを並べ、最後に#を置く。存在しないグループはスキップ
  const groupOrder = GOJUON_CHARS.filter(label => groups[label]);
  if (groups['#']) groupOrder.push('#');

  barEl.innerHTML = groupOrder.map(label =>
    `<div class="alpha-index-chip" onclick="scrollToAlphaGroup('${label}')">${label}</div>`
  ).join('');

  let html = '';
  for (const label of groupOrder) {
    html += `<div class="alpha-section-title" id="alpha-group-${label}"><span class="alpha-section-badge">${label}</span></div>`;
    html += groups[label].map(c => `
      <div class="customer-row">
        <div class="customer-main" onclick="openCustomerDetail('${c.id}')">
          <div class="customer-name">${c.name || '（名前未設定）'}</div>
        </div>
        <input type="text" class="furigana-input${c.furigana ? '' : ' empty'}" placeholder="ふりがな未入力"
          value="${c.furigana || ''}"
          onclick="event.stopPropagation()"
          onchange="updateFurigana('${c.id}', this.value)">
        ${c.is_blocked ? '<span class="blocked-badge">ブロック中</span>' : ''}
      </div>
    `).join('');
  }
  listEl.innerHTML = html;
}

function scrollToAlphaGroup(label){
  const el = document.getElementById('alpha-group-' + label);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function updateFurigana(customerId, value){
  const furigana = value.trim();
  const { error } = await sbClient.from('customers').update({ furigana: furigana || null }).eq('id', customerId);
  if (error) { alert('ふりがなの更新に失敗しました'); return; }
  const c = allCustomers.find(x => x.id === customerId);
  if (c) c.furigana = furigana || null;
  renderCustomerList();
}

async function openCustomerDetail(customerId){
  const c = allCustomers.find(x => x.id === customerId);
  if (!c) return;
  currentCustomer = c;
  document.getElementById('customer-list-view').style.display = 'none';
  document.getElementById('customer-detail-view').style.display = 'block';
  document.getElementById('detail-customer-name').textContent = (c.name || '（名前未設定）') + (c.is_blocked ? '（ブロック中）' : '');
  document.getElementById('customer-stats-row').innerHTML = '';
  document.getElementById('customer-logs-list').innerHTML = '<div class="loading">読み込み中...</div>';
  const { data } = await sbClient.from('training_logs').select('*').eq('customer_id', customerId).order('log_date', { ascending: false }).order('created_at', { ascending: false });
  currentCustomerLogs = data || [];
  renderCustomerStats();
  renderCustomerLogs();
}

function renderCustomerStats(){
  const el = document.getElementById('customer-stats-row');
  if (!currentCustomerLogs.length) { el.innerHTML = ''; return; }

  // 平均満足度
  const withScore = currentCustomerLogs.filter(l => l.satisfaction_score != null);
  const avgScore = withScore.length ? (withScore.reduce((sum, l) => sum + l.satisfaction_score, 0) / withScore.length) : null;

  // トレーナー別対応回数
  const trainerCounts = {};
  for (const l of currentCustomerLogs) {
    const name = l.trainer_name || '未選択';
    trainerCounts[name] = (trainerCounts[name] || 0) + 1;
  }
  const totalCount = currentCustomerLogs.length;
  const sortedTrainers = Object.entries(trainerCounts).sort((a, b) => b[1] - a[1]);
  const maxCount = sortedTrainers.length ? sortedTrainers[0][1] : 1;

  const satisfactionCard = `
    <div class="stat-card">
      <div class="stat-card-label">平均満足度</div>
      <div class="stat-card-value">${avgScore != null ? avgScore.toFixed(1) : '—'} <span style="font-size:14px;color:#ccc;">/ 5</span></div>
      <div class="stat-card-sub">${withScore.length}件の記録から算出</div>
    </div>`;

  const trainerBars = sortedTrainers.map(([name, count]) => {
    const pct = totalCount ? Math.round((count / totalCount) * 100) : 0;
    const barWidth = maxCount ? Math.round((count / maxCount) * 100) : 0;
    return `<div class="trainer-bar-row">
      <div class="trainer-bar-name">${name}</div>
      <div class="trainer-bar-track"><div class="trainer-bar-fill" style="width:${barWidth}%;"></div></div>
      <div class="trainer-bar-count">${count}回（${pct}%）</div>
    </div>`;
  }).join('');

  const trainerCard = `
    <div class="stat-card">
      <div class="stat-card-label">担当トレーナー内訳（全${totalCount}回）</div>
      ${trainerBars}
    </div>`;

  el.innerHTML = satisfactionCard + trainerCard;
}

function renderCustomerLogs(){
  const el = document.getElementById('customer-logs-list');
  if (!currentCustomerLogs.length) { el.innerHTML = '<div class="empty-msg">記録がありません</div>'; return; }
  const dn = ['日','月','火','水','木','金','土'];
  el.innerHTML = currentCustomerLogs.map(l => {
    const d = new Date(l.log_date + 'T00:00:00');
    const dateStr = `${d.getMonth()+1}月${d.getDate()}日（${dn[d.getDay()]}）`;
    const names = (l.exercises || []).map(e => e.name).join('・') || '（種目なし）';
    const stars = l.satisfaction_score ? '★'.repeat(l.satisfaction_score) + '☆'.repeat(5 - l.satisfaction_score) : '—';
    return `<div class="log-card" onclick="openLogDetail('${l.id}')">
      <div class="log-card-top"><span class="log-date">${dateStr}</span><span class="log-trainer">${l.trainer_name ? '担当: '+l.trainer_name : ''}</span></div>
      <div class="log-exercises">${names}</div>
      <div class="log-satisfaction">満足度: ${stars}</div>
    </div>`;
  }).join('');
}

function backToCustomerList(){
  document.getElementById('customer-detail-view').style.display = 'none';
  document.getElementById('customer-list-view').style.display = 'block';
}

function openLogDetail(logId){
  const l = currentCustomerLogs.find(x => x.id === logId);
  if (!l) return;
  const dn = ['日','月','火','水','木','金','土'];
  const d = new Date(l.log_date + 'T00:00:00');
  const dateStr = `${d.getMonth()+1}月${d.getDate()}日（${dn[d.getDay()]}）`;
  const stars = l.satisfaction_score ? '★'.repeat(l.satisfaction_score) + '☆'.repeat(5 - l.satisfaction_score) : '—';
  const exHtml = (l.exercises || []).map(ex => {
    const setsStr = (ex.sets || []).map((s,i) => `${i+1}セット目: ${s.weight}kg × ${s.reps}回`).join('<br>');
    return `<div class="ex-block"><div class="ex-block-name">${ex.name}</div><div class="ex-block-sets">${setsStr}</div></div>`;
  }).join('');
  document.getElementById('detail-modal-content').innerHTML = `
    <div class="detail-modal-close" onclick="closeDetailModal()">✕ 閉じる</div>
    <div class="detail-row"><span style="color:#888;">日付</span><span style="font-weight:700;">${dateStr}</span></div>
    <div class="detail-row"><span style="color:#888;">担当トレーナー</span><span style="font-weight:700;">${l.trainer_name || '—'}</span></div>
    <div class="detail-row"><span style="color:#888;">満足度</span><span style="color:#d99a00;font-weight:700;">${stars}</span></div>
    ${exHtml}
    ${l.memo ? `<div class="memo-block">${l.memo}</div>` : ''}
  `;
  document.getElementById('detail-modal-bg').classList.add('active');
}
function closeDetailModal(){
  document.getElementById('detail-modal-bg').classList.remove('active');
}

// ===== 種目マスター管理 =====
async function loadExerciseMaster(){
  const { data } = await sbClient.from('exercise_master').select('*');
  exerciseMaster = data || [];
  renderExerciseMaster();
}

function renderExerciseMaster(){
  const el = document.getElementById('exercise-master-list');
  if (!exerciseMaster.length) { el.innerHTML = '<div class="empty-msg">種目が登録されていません</div>'; return; }
  const groups = {};
  for (const ex of exerciseMaster) {
    if (!groups[ex.body_part]) groups[ex.body_part] = [];
    groups[ex.body_part].push(ex);
  }
  // ★ 各部位内は種目名の五十音順にソート
  for (const bp in groups) {
    groups[bp].sort((a, b) => a.name.localeCompare(b.name, 'ja'));
  }
  // ★ 部位の並び順は固定順（BODYPART_ORDER）→ 未知の部位は末尾に五十音順で追加
  const knownParts = BODYPART_ORDER.filter(bp => groups[bp]);
  const unknownParts = Object.keys(groups).filter(bp => !BODYPART_ORDER.includes(bp)).sort((a, b) => a.localeCompare(b, 'ja'));
  const order = [...knownParts, ...unknownParts];

  let html = '';
  for (const bp of order) {
    html += `<div class="bodypart-section-title">${bp}</div>`;
    html += groups[bp].map(ex => `
      <div class="exercise-row">
        <div class="exercise-row-name">
          <input type="text" value="${ex.name}" onchange="updateExerciseName('${ex.id}', this.value)">
        </div>
        <button class="exercise-row-btn danger" onclick="deleteExercise('${ex.id}', '${ex.name.replace(/'/g, "\\'")}')">削除する</button>
      </div>
    `).join('');
  }
  el.innerHTML = html;
}

async function addExercise(){
  const name = document.getElementById('new-ex-name').value.trim();
  const bodyPart = document.getElementById('new-ex-bodypart').value;
  if (!name) { alert('種目名を入力してください'); return; }
  const { error } = await sbClient.from('exercise_master').insert({ name, body_part: bodyPart });
  if (error) { alert('追加に失敗しました'); return; }
  document.getElementById('new-ex-name').value = '';
  await loadExerciseMaster();
}

async function updateExerciseName(id, newName){
  newName = newName.trim();
  if (!newName) { alert('種目名を空にはできません'); await loadExerciseMaster(); return; }
  const { error } = await sbClient.from('exercise_master').update({ name: newName }).eq('id', id);
  if (error) { alert('更新に失敗しました'); return; }
  await loadExerciseMaster();
}

async function deleteExercise(id, name){
  if (!confirm(`「${name}」を削除しますか？\n選択肢から選べなくなりますが、これまでの会員の記録は残ります。`)) return;
  const { error } = await sbClient.from('exercise_master').delete().eq('id', id);
  if (error) { alert('削除に失敗しました'); return; }
  await loadExerciseMaster();
}

window.addEventListener('DOMContentLoaded', init);
